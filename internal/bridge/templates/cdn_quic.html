<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connection</title>
</head>
<body>
<script nonce="__NONCE__">
(()=>{
'use strict';
const relayBase=__RELAY_BASE__,bootstrap=__BOOTSTRAP__,carrierMode=__CARRIER_MODE__;
const buildId="__BUILD_ID__";
const fragment=location.hash,androidNonce=/^#android=([A-Za-z0-9_-]{43})$/.exec(fragment)?.[1]||'';
history.replaceState(null,'',location.pathname);

if(typeof navigator!=='undefined'&&navigator.locks&&typeof navigator.locks.request==='function'){
 navigator.locks.request('tproxy_active_session',{mode:'shared'},()=>new Promise(()=>{})).catch(()=>{});
}

let initialized=false,closed=false,port=null,sessionToken='',resumeToken='',shortId='',createStarted=false;
let queuedBytes=0,queuedItems=0;
const streamControllers=new Set();
const lanes=new Map();
let currentStreamId=0;
let turboStreamsActive=0;
const maxTurboStreams=2;
let lastHeavyMediaTime=0;
let probeConsecutiveTimeouts=0;
let useSSEFallback=false;

// Dual-Lane QoS Uplink Queues
const vipQueue=[],bulkQueue=[];
const streamBytes=new Map();
const streamSeqMap=new Map();
const streamInflightMap=new Map();
const maxStreamInflightSubframes=40;

const queueLimit=33554432,queueItemLimit=16384,batchLimit=__BATCH_LIMIT__;
let upSeq=1,downCursor=0,upInflight=0,maxInflight=8;
const maxChunkBytes=6000;
const maxSubLen=5991;
const inflightSeqs=new Set();
let debounceTimer=0;
let lastSentAckCursor=0;
let failing=false;
const activeStreams=new Set();
const wakeSignals=new Set();
const upControllers=new Set();
let ackInflight=false;
let wakingUp=false;
let nackInflight=false;

// Multi-Stream Downlink Reorder Buffer & NACK
const downReorderMap=new Map();
const maxDownReorderWindow=32;
let reorderGapTimer=0;

function abortInflightUplinks(){
 for(const ctrl of Array.from(upControllers)){
  try{ctrl.abort()}catch(e){}
 }
 upControllers.clear();
}

const status=state=>{if(port&&!closed)port.postMessage({t:'status',state})};

function pause(ms){
 return new Promise(res=>{
  let t=0;
  const wake=()=>{
   if(t){clearTimeout(t);t=0}
   wakeSignals.delete(wake);
   res();
  };
  wakeSignals.add(wake);
  t=setTimeout(wake,ms);
 });
}

const hasNativeB64=typeof Uint8Array.prototype.toBase64==='function';

function toBase64Url(buf){
 const bytes=new Uint8Array(buf);
 if(hasNativeB64)return bytes.toBase64({alphabet:'base64url',omitPadding:true});
 let binary='';const chunk=4096;
 for(let i=0;i<bytes.length;i+=chunk){
  binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
 }
 return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function fromBase64Url(str){
 let base64=str.replace(/-/g,'+').replace(/_/g,'/');
 while(base64.length%4)base64+='=';
 const binary=atob(base64),len=binary.length,bytes=new Uint8Array(len);
 for(let i=0;i<len;i++)bytes[i]=binary.charCodeAt(i);
 return bytes.buffer;
}

function encodeFrame(type,streamId,payloadBytes){
 const plen=payloadBytes?payloadBytes.byteLength:0;
 const buf=new ArrayBuffer(8+plen);
 const view=new DataView(buf);
 view.setUint8(0,type);
 view.setUint8(1,(streamId>>16)&0xff);
 view.setUint8(2,(streamId>>8)&0xff);
 view.setUint8(3,streamId&0xff);
 view.setUint32(4,plen,false);
 if(plen>0)new Uint8Array(buf,8).set(new Uint8Array(payloadBytes));
 return buf;
}

function splitFrames(value){
 const view=new DataView(value),result=[];let offset=0;
 while(offset<value.byteLength){
  if(value.byteLength-offset<8||result.length>=4096)throw new Error('invalid frame batch');
  const type=view.getUint8(offset);
  const id=(view.getUint8(offset+1)<<16)|(view.getUint8(offset+2)<<8)|view.getUint8(offset+3);
  const length=view.getUint32(offset+4,false);
  offset+=8;
  if(offset+length>value.byteLength)throw new Error('invalid frame length');
  result.push({type,id,length,payload:new Uint8Array(value,offset,length),data:value.slice(offset-8,offset+length)});
  offset+=length;
 }
 return result;
}

function encodeSubFrame(type,sid,seq,flags,payloadBytes){
 const plen=payloadBytes?payloadBytes.byteLength:0;
 const arr=new Uint8Array(9+plen);
 arr[0]=type&0xff;
 arr[1]=(sid>>16)&0xff;
 arr[2]=(sid>>8)&0xff;
 arr[3]=sid&0xff;
 arr[4]=(seq>>8)&0xff;
 arr[5]=seq&0xff;
 arr[6]=flags&0xff;
 arr[7]=(plen>>8)&0xff;
 arr[8]=plen&0xff;
 if(plen>0)arr.set(payloadBytes,9);
 return arr;
}

function fail(){
 if(failing||closed)return;
 failing=true;
 if(reorderGapTimer){clearTimeout(reorderGapTimer);reorderGapTimer=0}
 downReorderMap.clear();
 if(port){
  for(const streamId of activeStreams){
   try{port.postMessage(encodeFrame(0x03,streamId,null))}catch(e){}
  }
  activeStreams.clear();
  status('failed');
  try{port.postMessage({t:'close'})}catch(e){}
 }
 setTimeout(()=>close(true),15);
}

function deliver(batchBuf){
 if(!batchBuf||!batchBuf.byteLength||closed||!port)return;
 let frames;
 try{frames=splitFrames(batchBuf)}catch(e){return}
 for(const frame of frames){
  if(frame.type===0x03){
   activeStreams.delete(frame.id);
   streamBytes.delete(frame.id);
   streamSeqMap.delete(frame.id);
   streamInflightMap.delete(frame.id);
  }
  port.postMessage(frame.data,[frame.data]);
 }
}

async function sendNackRequest(expectedCursor){
 if(closed||!sessionToken||nackInflight)return;
 nackInflight=true;
 try{
  const randHex=(Math.random()*0xffffffff>>>0).toString(16);
  const nackUrl=relayBase+'assets/media/'+shortId+'/seg_'+expectedCursor+'_'+randHex+'.m4s?ack='+expectedCursor+'&nack=1';
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),3000);
  const res=await fetch(nackUrl,{
   method:'GET',
   signal:ctrl.signal,
   mode:'same-origin',credentials:'omit',cache:'no-store',
   headers:{'X-Client-Key':sessionToken}
  });
  clearTimeout(timer);
  if(res.ok){
   const ct=res.headers.get('Content-Type');
   const resBuf=await res.arrayBuffer();
   processDownlink(resBuf,ct);
  }
 }catch(e){}
 finally{nackInflight=false}
}

function onReorderGapTimeout(){
 reorderGapTimer=0;
 if(closed||downReorderMap.size===0||!sessionToken)return;
 let slowestLane=null;
 let oldestTime=Infinity;
 for(const lane of lanes.values()){
  if(lane.lastChunkAt<oldestTime){
   oldestTime=lane.lastChunkAt;
   slowestLane=lane;
  }
 }
 if(slowestLane&&(lanes.size>1||(Date.now()-oldestTime>1200))){
  try{slowestLane.ctrl.abort()}catch(e){}
 }
 sendNackRequest(downCursor);
}

function scheduleGapHeal(){
 if(reorderGapTimer||closed||downReorderMap.size===0)return;
 reorderGapTimer=setTimeout(onReorderGapTimeout,250);
}

function deliverOrdered(cursor,payloadBuf){
 if(closed)return;
 const diff=(cursor-downCursor)|0;
 if(diff<=0&&downCursor!==0)return;

 const byteLen=payloadBuf?payloadBuf.byteLength:0;
 if(byteLen>=16384){
  lastHeavyMediaTime=Date.now();
  if(turboStreamsActive<maxTurboStreams){
   spawnTurboStream();
  }
 }

 if(cursor===downCursor+1||(downCursor===0&&cursor===1)){
  downCursor=cursor;
  if(byteLen>0)deliver(payloadBuf);

  while(downReorderMap.has(downCursor+1)){
   const nextCursor=downCursor+1;
   const savedBuf=downReorderMap.get(nextCursor);
   downReorderMap.delete(nextCursor);
   downCursor=nextCursor;
   if(savedBuf&&savedBuf.byteLength>0)deliver(savedBuf);
  }

  if(downReorderMap.size===0&&reorderGapTimer){
   clearTimeout(reorderGapTimer);
   reorderGapTimer=0;
  }else if(downReorderMap.size>0){
   if(reorderGapTimer){clearTimeout(reorderGapTimer);reorderGapTimer=0}
   scheduleGapHeal();
  }
  return;
 }

 if(diff>1&&diff<=maxDownReorderWindow){
  if(!downReorderMap.has(cursor)){
   downReorderMap.set(cursor,payloadBuf?payloadBuf.slice():null);
  }
  scheduleGapHeal();
 }else if(diff>maxDownReorderWindow){
  const keys=Array.from(downReorderMap.keys()).sort((a,b)=>a-b);
  for(const k of keys){
   const b=downReorderMap.get(k);
   downReorderMap.delete(k);
   if(k>downCursor){
    downCursor=k;
    if(b&&b.byteLength>0)deliver(b);
   }
  }
  downCursor=cursor;
  if(byteLen>0)deliver(payloadBuf);
 }
}

function maybeSendDownAck(){
 const unackedCount=(downCursor-lastSentAckCursor)|0;
 if(unackedCount>=3){
  if(hasPendingUplink()&&upInflight<maxInflight){
   flushUplink();
  }else if(!hasPendingUplink()||unackedCount>=6){
   sendAckOnly();
  }
 }
}

function parseGLTF(buf){
 if(buf.byteLength<12)return null;
 const view=new DataView(buf);
 if(view.getUint8(0)!==0x67||view.getUint8(1)!==0x6c||view.getUint8(2)!==0x54||view.getUint8(3)!==0x46)return null;
 const ver=view.getUint32(4,true);
 if(ver!==2)return null;
 const cur=view.getUint32(8,false);
 return {cursor:cur,payload:buf.slice(12)};
}

function processDownlink(resBuf,ct){
 if(!resBuf||resBuf.byteLength===0)return true;
 if(ct&&ct.includes('text/html'))return false;
 if(ct&&(ct.includes('model/gltf-binary')||ct.includes('application/octet-stream'))){
  const parsed=parseGLTF(resBuf);
  if(!parsed)return false;
  if((parsed.cursor-downCursor|0)>0||downCursor===0){
   deliverOrdered(parsed.cursor,parsed.payload);
  }
  return true;
 }
 if(ct&&ct.includes('application/json')){
  try{
   const dec=new TextDecoder().decode(resBuf);
   if(!dec.trim())return true;
   const obj=JSON.parse(dec);
   if(!obj||typeof obj!=='object'||obj.s!==1)return false;
   if(typeof obj.c==='number'&&((obj.c-downCursor|0)>0||downCursor===0)&&downReorderMap.size===0){
    downCursor=obj.c;
   }
   return true;
  }catch(e){
   return false;
  }
 }
 return false;
}

let initDone=false;

async function tryGetInit(helloBuf,timeoutMs){
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
 try{
  const helloB64=toBase64Url(helloBuf);
  const getUrl=relayBase+'_next/data/'+buildId+'/init/'+encodeURIComponent(bootstrap)+'/'+helloB64+'.json';
  const res=await fetch(getUrl,{
   method:'GET',
   signal:ctrl.signal,
   mode:'same-origin',credentials:'omit',cache:'no-store',
   headers:{'X-Client-Key':bootstrap}
  });
  clearTimeout(timer);
  if(res.ok&&!initDone&&!closed){
   const json=await res.json();
   if(json&&json.token&&!initDone&&!closed){
    initDone=true;
    sessionToken=json.token;
    resumeToken=json.resume_token||json.token;
    shortId=json.short_id||json.token.slice(0,12);
    if(json.welcome)deliver(fromBase64Url(json.welcome));
    return true;
   }
  }
 }catch(e){}
 finally{clearTimeout(timer)}
 return false;
}

async function createSession(helloBuf){
 status('connecting');
 let ok=await tryGetInit(helloBuf,5000);
 if(!ok&&!closed){
  await pause(60);
  if(!closed)ok=await tryGetInit(helloBuf,5000);
 }

 if(!ok||closed){
  fail();
  return;
 }

 status('connected');
 startStreamLoop();
 flushUplink();
}

function hasPendingUplink(){
 return vipQueue.length>0||bulkQueue.length>0;
}

function queueCarrier(buf){
 if(closed)return;
 let frames;
 try{frames=splitFrames(buf)}catch(e){fail();return}
 for(const f of frames){
  const sid=f.id;
  const type=f.type;
  if(type===0x01){
   activeStreams.add(sid);
   streamSeqMap.set(sid,1);
   streamBytes.set(sid,0);
   streamInflightMap.set(sid,0);
  }
  const curBytes=streamBytes.get(sid)||0;
  streamBytes.set(sid,curBytes+f.length);

  const isVIP=(type===0x01||type===0x03||type===0x04)||(type===0x02&&(curBytes<65536||f.length<=4096));
  const queue=isVIP?vipQueue:bulkQueue;

  // Window frame coalescing in vipQueue:
  if(type===0x04&&f.length===4){
   let coalesced=false;
   const addCredit=new DataView(f.payload.buffer,f.payload.byteOffset,4).getUint32(0,false);
   for(let i=vipQueue.length-1;i>=0;i--){
    const item=vipQueue[i];
    if(item[0]===0x04){
     const isid=(item[1]<<16)|(item[2]<<8)|item[3];
     if(isid===sid&&item.byteLength===13){
      const idv=new DataView(item.buffer,item.byteOffset+9,4);
      const prevCredit=idv.getUint32(0,false);
      const sum=prevCredit+addCredit;
      if(sum<=0xffffffff){
       idv.setUint32(0,sum>>>0,false);
       coalesced=true;
       break;
      }
     }
    }
   }
   if(coalesced)continue;
  }

  // Fragment frame into subframes of at most maxSubLen (5991) bytes:
  const plen=f.payload.byteLength;
  if(plen<=maxSubLen){
   const seq=streamSeqMap.get(sid)??1;
   streamSeqMap.set(sid,(seq+1)&0xffff);
   const sub=encodeSubFrame(type,sid,seq,0x03,f.payload);
   queue.push(sub);
   queuedBytes+=sub.byteLength;
   queuedItems++;
  }else{
   let off=0;
   while(off<plen){
    const chunkLen=Math.min(maxSubLen,plen-off);
    const flags=(off===0?0x01:0)|(off+chunkLen===plen?0x02:0);
    const seq=streamSeqMap.get(sid)??1;
    streamSeqMap.set(sid,(seq+1)&0xffff);
    const sub=encodeSubFrame(type,sid,seq,flags,f.payload.subarray(off,off+chunkLen));
    queue.push(sub);
    queuedBytes+=sub.byteLength;
    queuedItems++;
    off+=chunkLen;
   }
  }

  // Clean up maps AFTER encoding CLOSE subframe so CLOSE gets the proper stream sequence number!
  if(type===0x03){
   activeStreams.delete(sid);
   streamBytes.delete(sid);
   streamSeqMap.delete(sid);
  }
 }

 if(queuedBytes>queueLimit||queuedItems>queueItemLimit){fail();return}

 // Immediate First Dispatch: 0 ms delay when upInflight === 0
 if(sessionToken&&upInflight===0&&!debounceTimer){
  flushUplink();
 }else{
  scheduleFlush();
 }
}

function scheduleFlush(){
 if(debounceTimer||closed||!sessionToken)return;
 debounceTimer=setTimeout(()=>{
  debounceTimer=0;
  flushUplink();
 },2);
}

function pickNextSubFrame(){
 if(vipQueue.length>0)return vipQueue.shift();
 for(let i=0;i<bulkQueue.length;i++){
  const sub=bulkQueue[i];
  const sid=(sub[1]<<16)|(sub[2]<<8)|sub[3];
  const inf=streamInflightMap.get(sid)||0;
  if(inf<maxStreamInflightSubframes){
   bulkQueue.splice(i,1);
   return sub;
  }
 }
 return null;
}

function peekNextSubFrameSize(){
 if(vipQueue.length>0)return vipQueue[0].byteLength;
 for(let i=0;i<bulkQueue.length;i++){
  const sub=bulkQueue[i];
  const sid=(sub[1]<<16)|(sub[2]<<8)|sub[3];
  const inf=streamInflightMap.get(sid)||0;
  if(inf<maxStreamInflightSubframes)return sub.byteLength;
 }
 return 0;
}

function flushUplink(){
 while(!closed&&sessionToken&&hasPendingUplink()&&upInflight<maxInflight){
  // Reserve 1 slot for VIP control/interactive frames when bulk media is uploading
  if(vipQueue.length===0&&upInflight>=maxInflight-1)break;

  let total=0;
  const parts=[];
  const touchedStreams=[];

  while(hasPendingUplink()&&total<maxChunkBytes&&parts.length<64){
   const nextSize=peekNextSubFrameSize();
   if(nextSize===0)break;
   if(total>0&&total+nextSize>maxChunkBytes)break;
   const sub=pickNextSubFrame();
   if(!sub)break;
   const sid=(sub[1]<<16)|(sub[2]<<8)|sub[3];
   streamInflightMap.set(sid,(streamInflightMap.get(sid)||0)+1);
   touchedStreams.push(sid);
   parts.push(sub);
   total+=sub.byteLength;
   queuedBytes-=sub.byteLength;
   queuedItems--;
  }

  if(total===0)break;

  let payloadBuf;
  if(parts.length===1&&parts[0].byteOffset===0&&parts[0].byteLength===parts[0].buffer.byteLength){
   payloadBuf=parts[0].buffer;
  }else{
   const merged=new Uint8Array(total);
   let off=0;
   for(const p of parts){
    merged.set(p,off);
    off+=p.byteLength;
   }
   payloadBuf=merged.buffer;
  }

  const seq=upSeq++;
  upInflight++;
  inflightSeqs.add(seq);
  sendChunkWithBackoff(seq,payloadBuf,0,touchedStreams);
 }
}

function releaseStreamInflight(touchedStreams){
 if(!touchedStreams)return;
 for(let i=0;i<touchedStreams.length;i++){
  const sid=touchedStreams[i];
  const cur=streamInflightMap.get(sid)||0;
  if(cur<=1)streamInflightMap.delete(sid);
  else streamInflightMap.set(sid,cur-1);
 }
}

async function sendChunkWithBackoff(seq,buf,retry,touchedStreams){
 const b64=toBase64Url(buf);
 const urlPart=b64.slice(0,2000);
 const remaining=b64.slice(2000);
 const dataHeaders=[];
 let roff=0,hidx=0;
 while(roff<remaining.length&&hidx<8){
  dataHeaders.push(['X-Client-Data-'+hidx,remaining.slice(roff,roff+3000)]);
  roff+=3000;hidx++;
 }

 while(!closed){
  const cur=downCursor;
  lastSentAckCursor=cur;
  const reqId=seq+'.'+cur+'.'+retry;
  let success=false;
  const ctrl=new AbortController();
  const timeoutMs=retry===0?4000:6000;
  const reqTimer=setTimeout(()=>ctrl.abort(),timeoutMs);
  upControllers.add(ctrl);
  try{
   const headers={
    'X-Client-Key':sessionToken,
    'X-Request-ID':reqId,
    'X-Down-Cursor':String(cur),
    'X-Sub-Frames':'1',
    'X-Coalesce':(streamControllers.size===0&&bulkQueue.length===0&&upInflight<=1)?'1':'0'
   };
   for(let i=0;i<dataHeaders.length;i++){
    headers[dataHeaders[i][0]]=dataHeaders[i][1];
   }
   const retrySuffix=retry>0?'&r='+retry+'_'+((Math.random()*0xffff)|0).toString(16):'';
   const getUrl=relayBase+'assets/chunks/'+shortId+'/'+seq+'.bin?p='+encodeURIComponent(urlPart)+retrySuffix;
   const res=await fetch(getUrl,{
    method:'GET',
    signal:ctrl.signal,
    mode:'same-origin',credentials:'omit',cache:'no-store',
    headers
   });
   clearTimeout(reqTimer);
   if(res.ok){
    const ct=res.headers.get('Content-Type');
    const resBuf=await res.arrayBuffer();
    if(!processDownlink(resBuf,ct)){
     releaseStreamInflight(touchedStreams);
     inflightSeqs.delete(seq);
     upInflight--;
     fail();
     return;
    }
    success=true;
   }else if(res.status===404||res.status===410){
    releaseStreamInflight(touchedStreams);
    inflightSeqs.delete(seq);
    upInflight--;
    fail();
    return;
   }
  }catch(e){
  }finally{
   clearTimeout(reqTimer);
   upControllers.delete(ctrl);
  }

  if(success){
   releaseStreamInflight(touchedStreams);
   inflightSeqs.delete(seq);
   upInflight--;
   if(hasPendingUplink())flushUplink();
   return;
  }

  if(closed){
   releaseStreamInflight(touchedStreams);
   inflightSeqs.delete(seq);
   upInflight--;
   return;
  }

  const isBg=(typeof document!=='undefined'&&document.visibilityState==='hidden')||(typeof navigator!=='undefined'&&navigator.onLine===false);
  const nextRetry=isBg?retry:retry+1;
  retry=nextRetry;
  if(retry>12){
   releaseStreamInflight(touchedStreams);
   inflightSeqs.delete(seq);
   upInflight--;
   fail();
   return;
  }
  const delay=isBg?2000:Math.min(1000,40*(1<<Math.min(retry,5)))+(Math.random()*40|0);
  await pause(delay);
 }
 releaseStreamInflight(touchedStreams);
 inflightSeqs.delete(seq);
 upInflight--;
}

async function sendAckOnly(){
 if(closed||!sessionToken||ackInflight)return;
 ackInflight=true;
 const cur=downCursor;
 lastSentAckCursor=cur;
 const randHex=(Math.random()*0xffffffff>>>0).toString(16);
 const ackUrl=relayBase+'assets/chunks/'+shortId+'/0.bin?p=&r='+randHex;
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),4000);
 try{
  const res=await fetch(ackUrl,{
   method:'GET',
   signal:ctrl.signal,
   mode:'same-origin',credentials:'omit',cache:'no-store',
   headers:{
    'X-Client-Key':sessionToken,
    'X-Request-ID':'0.'+cur+'.0',
    'X-Down-Cursor':String(cur)
   }
  });
  clearTimeout(timer);
  if(res.ok){
   const ct=res.headers.get('Content-Type');
   const resBuf=await res.arrayBuffer();
   if(!processDownlink(resBuf,ct))fail();
  }else if(res.status===404||res.status===410){
   fail();
  }
 }catch(e){}
 finally{
  clearTimeout(timer);
  ackInflight=false;
  if(!closed&&sessionToken&&(downCursor-lastSentAckCursor)>=3){
   if(hasPendingUplink()&&upInflight<maxInflight)flushUplink();
   else sendAckOnly();
  }
 }
}

function createStreamAssembler(){
 let buf=new Uint8Array(65536);
 let readOff=0,writeOff=0;
 let headerParsed=false;
 return {
  feed(chunk,onEnvelope){
   if(writeOff+chunk.byteLength>buf.length){
    const needed=writeOff-readOff+chunk.byteLength;
    if(needed>buf.length){
     let newCap=buf.length*2;
     while(newCap<needed)newCap*=2;
     const newBuf=new Uint8Array(newCap);
     newBuf.set(buf.subarray(readOff,writeOff),0);
     writeOff-=readOff;readOff=0;
     buf=newBuf;
    }else{
     buf.copyWithin(0,readOff,writeOff);
     writeOff-=readOff;readOff=0;
    }
   }
   buf.set(chunk,writeOff);
   writeOff+=chunk.byteLength;

   if(!headerParsed){
    if(writeOff-readOff<12)return;
    const view=new DataView(buf.buffer,buf.byteOffset+readOff,12);
    if(view.getUint8(0)!==0x67||view.getUint8(1)!==0x6c||view.getUint8(2)!==0x54||view.getUint8(3)!==0x46){
     throw new Error('invalid gltf streaming prefix');
    }
    const ver=view.getUint32(4,true);
    if(ver!==2)throw new Error('invalid gltf version');
    readOff+=12;
    headerParsed=true;
   }

   while(writeOff-readOff>=8){
    const view=new DataView(buf.buffer,buf.byteOffset+readOff,8);
    const cursor=view.getUint32(0,false);
    const length=view.getUint32(4,false);
    if(length>2*1024*1024)throw new Error('stream envelope length exceeded');
    if(writeOff-readOff<8+length)break;
    let payloadBuf=null;
    if(length>0){
     payloadBuf=buf.buffer.slice(buf.byteOffset+readOff+8,buf.byteOffset+readOff+8+length);
    }
    readOff+=8+length;
    onEnvelope(cursor,payloadBuf);
   }

   if(readOff===writeOff){
    readOff=0;writeOff=0;
   }
  }
 };
}

function startStreamLoop(){
 currentStreamId++;
 runStream(currentStreamId,false);
}

function spawnTurboStream(){
 if(closed||!sessionToken||turboStreamsActive>=maxTurboStreams)return;
 turboStreamsActive++;
 const turboId=10000+((Math.random()*90000)|0);
 runStream(turboId,true);
}

async function runStream(streamId,isTurbo){
 if(closed||!sessionToken){
  if(isTurbo&&turboStreamsActive>0)turboStreamsActive--;
  return;
 }
 let probeTimer=0,watchdogTimer=0,overlapTimer=0,probeFired=false,overlapTriggered=false;
 const ctrl=new AbortController();
 streamControllers.add(ctrl);
 lanes.set(streamId,{ctrl,lastChunkAt:Date.now(),isTurbo});

 const cleanup=()=>{
  clearTimeout(probeTimer);
  clearTimeout(watchdogTimer);
  clearTimeout(overlapTimer);
  streamControllers.delete(ctrl);
  lanes.delete(streamId);
 };

 try{
  const randHex=(Math.random()*0xffffffff>>>0).toString(16);
  const streamUrl=relayBase+'assets/media/'+shortId+'/stream_'+downCursor+'_'+randHex+'.m4s';

  probeTimer=setTimeout(()=>{
   probeFired=true;
   try{ctrl.abort()}catch(e){}
  },1800);

  const resetWatchdog=()=>{
   clearTimeout(watchdogTimer);
   watchdogTimer=setTimeout(()=>{
    try{ctrl.abort()}catch(e){}
   },16000);
  };
  resetWatchdog();

  const streamHeaders={
   'X-Client-Key':sessionToken,
   'X-Stream-Poll':'1'
  };
  if(useSSEFallback){
   streamHeaders['X-SSE-Stream']='1';
   streamHeaders['Accept']='text/event-stream, model/gltf-binary';
  }else{
   streamHeaders['Accept']='model/gltf-binary, text/event-stream';
  }

  const res=await fetch(streamUrl,{
   method:'GET',
   signal:ctrl.signal,
   mode:'same-origin',credentials:'omit',cache:'no-store',
   headers:streamHeaders
  });

  if(!res.ok){
   cleanup();
   if(isTurbo){if(turboStreamsActive>0)turboStreamsActive--;return}
   if(res.status===404||res.status===410){
    fail();return;
   }
   if(streamId===currentStreamId&&!closed){
    await pause(150+(Math.random()*150|0));
    if(streamId===currentStreamId&&!closed){
     currentStreamId++;
     runStream(currentStreamId,false);
    }
   }
   return;
  }

  const ct=res.headers.get('Content-Type')||'';
  if(ct.includes('text/html')){
   cleanup();
   if(isTurbo){if(turboStreamsActive>0)turboStreamsActive--;return}
   fail();return;
  }

  if(!res.body||typeof res.body.getReader!=='function'){
   cleanup();
   if(isTurbo){if(turboStreamsActive>0)turboStreamsActive--;return}
   fail();return;
  }

  const isSSE=ct.includes('text/event-stream');
  const reader=res.body.getReader();
  const assembler=isSSE?null:createStreamAssembler();
  const textDecoder=isSSE?new TextDecoder():null;
  let sseBuffer='';
  let firstChunk=false;

  while(!closed&&sessionToken){
   const {done,value}=await reader.read();
   if(done)break;
   const lane=lanes.get(streamId);
   if(lane)lane.lastChunkAt=Date.now();
   if(!firstChunk){
    firstChunk=true;
    clearTimeout(probeTimer);
    probeConsecutiveTimeouts=0;
    if(!isTurbo){
     overlapTimer=setTimeout(()=>{
      overlapTriggered=true;
      if(!closed&&sessionToken&&streamId===currentStreamId){
       currentStreamId++;
       runStream(currentStreamId,false);
      }
     },38000);
    }
   }
   resetWatchdog();

   if(!isSSE&&assembler){
    assembler.feed(value,(cursor,payloadBuf)=>{
     if(payloadBuf&&payloadBuf.byteLength>0){
      deliverOrdered(cursor,payloadBuf);
      maybeSendDownAck();
     }else if(((cursor-downCursor|0)>0||downCursor===0)&&downReorderMap.size===0){
      downCursor=cursor;
     }
    });
   }else if(isSSE&&textDecoder){
    sseBuffer+=textDecoder.decode(value,{stream:true});
    const lines=sseBuffer.split('\n');
    sseBuffer=lines.pop()||'';
    for(const rawLine of lines){
     const line=rawLine.trim();
     if(!line||line.startsWith(':'))continue;
     if(line.startsWith('data: ')){
      const b64=line.slice(6).trim();
      if(b64){
       const envBuf=fromBase64Url(b64);
       if(envBuf.byteLength>=4){
        const dv=new DataView(envBuf);
        const cursor=dv.getUint32(0,false);
        const payloadBuf=envBuf.byteLength>4?envBuf.slice(4):null;
        if(payloadBuf&&payloadBuf.byteLength>0){
         deliverOrdered(cursor,payloadBuf);
         maybeSendDownAck();
        }else if(((cursor-downCursor|0)>0||downCursor===0)&&downReorderMap.size===0){
         downCursor=cursor;
        }
       }
      }
     }
    }
   }

   if(isTurbo&&(Date.now()-lastHeavyMediaTime>12000)){
    break;
   }
  }
  cleanup();

  if(isTurbo){
   if(!closed&&sessionToken&&(Date.now()-lastHeavyMediaTime<=10000)){
    const nextTurboId=10000+((Math.random()*90000)|0);
    runStream(nextTurboId,true);
   }else if(turboStreamsActive>0){
    turboStreamsActive--;
   }
   return;
  }

  if(!overlapTriggered&&streamId===currentStreamId&&!closed&&sessionToken){
   currentStreamId++;
   runStream(currentStreamId,false);
  }
 }catch(e){
  cleanup();
  if(closed){
   if(isTurbo&&turboStreamsActive>0)turboStreamsActive--;
   return;
  }
  if(e&&(e.message==='invalid gltf streaming prefix'||e.message==='stream envelope length exceeded')){
   if(isTurbo){if(turboStreamsActive>0)turboStreamsActive--;return}
   fail();return;
  }
  if(isTurbo){
   if(Date.now()-lastHeavyMediaTime<=8000&&!closed&&sessionToken){
    await pause(50);
    const nextTurboId=10000+((Math.random()*90000)|0);
    runStream(nextTurboId,true);
   }else if(turboStreamsActive>0){
    turboStreamsActive--;
   }
   return;
  }
  if(streamId!==currentStreamId)return;
  if(wakingUp){
   wakingUp=false;
   probeConsecutiveTimeouts=0;
   currentStreamId++;
   runStream(currentStreamId,false);
   return;
  }
  if(probeFired){
   probeConsecutiveTimeouts++;
   if(!useSSEFallback){
    useSSEFallback=true;
   }
   if(probeConsecutiveTimeouts>=2){
    probeConsecutiveTimeouts=0;
    await sendNackRequest(downCursor);
   }
  }
  if(streamId===currentStreamId&&!closed){
   await pause(20+(Math.random()*30|0));
   if(streamId===currentStreamId&&!closed){
    currentStreamId++;
    runStream(currentStreamId,false);
   }
  }
 }
}

function close(notifyServer){
 if(closed)return;
 closed=true;
 failing=true;
 if(reorderGapTimer){clearTimeout(reorderGapTimer);reorderGapTimer=0}
 downReorderMap.clear();
 for(const sCtrl of Array.from(streamControllers)){
  try{sCtrl.abort()}catch(e){}
 }
 streamControllers.clear();
 lanes.clear();
 turboStreamsActive=0;
 abortInflightUplinks();
 if(notifyServer&&sessionToken&&shortId){
  const unloadUrl=relayBase+'_next/data/'+buildId+'/unload/'+shortId+'.json?t='+Date.now();
  fetch(unloadUrl,{
   method:'GET',
   keepalive:true,
   mode:'same-origin',
   credentials:'omit',
   headers:{'X-Client-Key':sessionToken}
  }).catch(()=>{});
 }
 if(port)port.close();
}

function activatePort(nextPort){
 initialized=true;port=nextPort;
 port.onmessage=message=>{
  if(message.data instanceof ArrayBuffer){
   if(!createStarted){createStarted=true;createSession(message.data)}
   else queueCarrier(message.data);
  }else if(message.data&&message.data.t==='close')close(true);
 };
 port.start();status('connecting');
}

addEventListener('message',event=>{
 if(initialized||event.source!==parent||event.data===null||typeof event.data!=='object')return;
 const keys=Object.keys(event.data).sort();
 if(keys.length!==2||keys[0]!=='t'||keys[1]!=='v'||event.data.t!=='tproxy-init'||event.data.v!==1||event.ports.length!==1)return;
 let source;try{source=new URL(event.origin)}catch(error){return}
 if(source.protocol!=='http:'||source.hostname!=='127.0.0.1'||!source.port||source.origin!==event.origin)return;
 activatePort(event.ports[0]);
},{once:false});

const androidBridge=globalThis.TelegramWebProxy;
if(!initialized&&androidNonce&&androidBridge&&typeof androidBridge.postMessage==='function'){
 const androidPort={onmessage:null,start(){},close(){androidBridge.onmessage=null},postMessage(value){
  if(value instanceof ArrayBuffer){
   let frames;try{frames=splitFrames(value)}catch(error){fail();return}
   for(const frame of frames)androidBridge.postMessage(frame.data);
  }else androidBridge.postMessage(JSON.stringify(value));
 }};
 androidBridge.onmessage=event=>{
  let data=event.data;if(typeof data==='string'){try{data=JSON.parse(data)}catch(error){return}}
  if(androidPort.onmessage)androidPort.onmessage({data});
 };
 activatePort(androidPort);androidBridge.postMessage(JSON.stringify({t:'tproxy-android-init',v:1,nonce:androidNonce}));
}

let lastWakeAt=0,lastTick=Date.now();
setInterval(()=>{lastTick=Date.now()},1000);

function onWakeUp(isOnline,fromHidden){
 if(closed||!sessionToken)return;
 const now=Date.now();
 if(now-lastWakeAt<250)return;
 lastWakeAt=now;
 const slept=(now-lastTick>6000);
 lastTick=now;
 for(const wake of Array.from(wakeSignals))wake();
 if(isOnline||slept||fromHidden){
  wakingUp=true;
  for(const sCtrl of Array.from(streamControllers)){
   try{sCtrl.abort()}catch(e){}
  }
  streamControllers.clear();
  lanes.clear();
  turboStreamsActive=0;
  if(isOnline||slept)abortInflightUplinks();
 }else if(streamControllers.size===0){
  wakingUp=true;
  startStreamLoop();
 }
 if(hasPendingUplink()&&upInflight<maxInflight){
  flushUplink();
 }else if(!hasPendingUplink()&&(isOnline||slept||fromHidden)){
  sendAckOnly();
 }
}

if(typeof document!=='undefined'){
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')onWakeUp(false,true);
 });
}
if(typeof addEventListener==='function'){
 addEventListener('focus',()=>onWakeUp(false,false));
 addEventListener('online',()=>onWakeUp(true,false));
 addEventListener('pageshow',()=>onWakeUp(false,false));
}

addEventListener('pagehide',()=>close(true),{once:true});
})();
</script>
