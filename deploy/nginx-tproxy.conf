# /etc/nginx/sites-available/tproxy.conf
#
# Reference Nginx configuration for tproxy-server.
# Replaces Caddy when using Nginx as the front TLS-terminating reverse proxy.
#
# Replace proxy.example.com with your dedicated hostname.

# Map Upgrade header to Connection header for WebSocket support (/api/v1/ws)
# while preserving keepalive for ordinary HTTP/1.1 requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream tproxy_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # For Nginx >= 1.25.1, use `http2 on;` instead of `http2` parameter above:
    # http2 on;

    server_name proxy.example.com;

    # SSL / TLS configuration (example using Certbot / Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # IMPORTANT:
    # Do NOT set `X-Frame-Options: DENY` or restrict `frame-ancestors` here!
    # The bridge page is loaded inside an app-owned WebView container.
    # The relay Go server manages its own strict loopback CSP headers for the bridge.

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    # Carrier batches reach up to 2 MiB. Nginx defaults to 1 MiB and will reject
    # uplink payloads with HTTP 413 (Payload Too Large) if not increased.
    client_max_body_size 4m;

    # Privacy / Active Probing hygiene:
    # Never log query parameters (which carry the bridge capability token)
    # or Authorization / Sec-WebSocket-Protocol headers.
    access_log off;
    error_log /var/log/nginx/tproxy_error.log warn;

    # Hide proxy identifiers
    proxy_hide_header Via;
    server_tokens off;

    # Proxy EVERY path to the relay backend.
    # The relay serves the public site (or forwards to public_upstream),
    # while authentic bridge/session requests are intercepted in-process.
    location / {
        proxy_pass http://tproxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # CRITICAL:
        # Pass exactly ONE client IP address in X-Forwarded-For.
        # MUST NOT use `$proxy_add_x_forwarded_for`: it appends to any incoming
        # header and creates a comma-separated list, which the relay explicitly
        # rejects for capacity accounting.
        proxy_set_header X-Forwarded-For $remote_addr;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming and Long-poll Timeouts:
        # The relay long-poll (/api/v1/down) holds parked requests up to 25s.
        # Timeouts must stay well above this so parked polls are not prematurely cut.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;

        # Buffering:
        # Disable buffering so real-time streaming frames are flushed immediately.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
